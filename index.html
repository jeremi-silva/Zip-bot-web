<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vending Mecatrónica - Pago QR</title>
  <!-- Tailwind CSS para diseño moderno sin esfuerzo -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- SDK Oficial de Supabase -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-slate-900 text-white min-h-screen flex flex-col justify-between p-4">

  <!-- ENCABEZADO -->
  <header class="text-center my-4">
    <h1 class="text-2xl font-bold text-blue-400">🤖 Vending Mecatrónica</h1>
    <p class="text-slate-400 text-sm">Escoge tu componente para autorizar el despacho</p>
  </header>

  <!-- CONTENEDOR DE PRODUCTOS -->
  <main class="grid grid-cols-2 gap-4 max-w-md mx-auto w-full">
    
    <!-- Producto 1 -->
    <div class="bg-slate-800 p-4 rounded-xl border border-slate-700 text-center flex flex-col justify-between">
      <div>
        <span class="text-3xl">⚡</span>
        <h3 class="font-bold text-lg mt-2">Resistencia</h3>
        <p class="text-xs text-slate-400">Casillero #1</p>
      </div>
      <button onclick="comprarProducto(1, 'Resistencia')" class="mt-3 bg-blue-600 hover:bg-blue-500 text-white font-bold py-2 px-4 rounded-lg w-full transition">
        Comprar $0.50
      </button>
    </div>

    <!-- Producto 2 -->
    <div class="bg-slate-800 p-4 rounded-xl border border-slate-700 text-center flex flex-col justify-between">
      <div>
        <span class="text-3xl">💡</span>
        <h3 class="font-bold text-lg mt-2">Diodo LED</h3>
        <p class="text-xs text-slate-400">Casillero #2</p>
      </div>
      <button onclick="comprarProducto(2, 'Diodo LED')" class="mt-3 bg-blue-600 hover:bg-blue-500 text-white font-bold py-2 px-4 rounded-lg w-full transition">
        Comprar $0.25
      </button>
    </div>

    <!-- Producto 3 -->
    <div class="bg-slate-800 p-4 rounded-xl border border-slate-700 text-center flex flex-col justify-between">
      <div>
        <span class="text-3xl">🔋</span>
        <h3 class="font-bold text-lg mt-2">Capacitor</h3>
        <p class="text-xs text-slate-400">Casillero #3</p>
      </div>
      <button onclick="comprarProducto(3, 'Capacitor')" class="mt-3 bg-blue-600 hover:bg-blue-500 text-white font-bold py-2 px-4 rounded-lg w-full transition">
        Comprar $0.75
      </button>
    </div>

    <!-- Producto 4 -->
    <div class="bg-slate-800 p-4 rounded-xl border border-slate-700 text-center flex flex-col justify-between">
      <div>
        <span class="text-3xl">🔌</span>
        <h3 class="font-bold text-lg mt-2">Diodo 1N4007</h3>
        <p class="text-xs text-slate-400">Casillero #4</p>
      </div>
      <button onclick="comprarProducto(4, 'Diodo 1N4007')" class="mt-3 bg-blue-600 hover:bg-blue-500 text-white font-bold py-2 px-4 rounded-lg w-full transition">
        Comprar $0.30
      </button>
    </div>

  </main>

  <!-- SECCIÓN DE ESTADO / ALERTAS -->
  <div id="statusBox" class="hidden max-w-md mx-auto w-full bg-slate-800 border p-4 rounded-xl text-center my-4">
    <p id="statusText" class="font-bold text-sm"></p>
  </div>

  <!-- PIE DE PÁGINA -->
  <footer class="text-center text-xs text-slate-500 my-4">
    Sistema de Venta Automatizado • Conectado a Supabase
  </footer>

  <!-- LÓGICA JAVASCRIPT -->
  <script>
    // Configuración de Supabase (Reemplaza con tus llaves públicas)
    const SUPABASE_URL = 'https://ijrmiocmibwanzvdtmdt.supabase.co/rest/v1/';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imlqcm1pb2NtaWJ3YW56dmR0bWR0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODU5ODYzMDcsImV4cCI6MjEwMTU2MjMwN30.KUTr0xewMNLJ0865IyUkum_CiX3sm5VaPJaeBobOJ4s'; // Usar la Anon Public Key

    const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    async function comprarProducto(productId, nombreProducto) {
      const statusBox = document.getElementById('statusBox');
      const statusText = document.getElementById('statusText');

      statusBox.classList.remove('hidden', 'border-green-500', 'border-red-500', 'border-yellow-500');
      statusBox.classList.add('border-yellow-500');
      statusText.innerText = `⏳ Autorizando despacho de ${nombreProducto}...`;

      try {
        // Enviar la orden de compra a la tabla o Edge Function de Supabase
        const { data, error } = await _supabase
          .from('ordenes_qr')
          .insert([
            { product_id: productId, estado: 'pendiente' }
          ]);

        if (error) throw error;

        statusBox.classList.remove('border-yellow-500');
        statusBox.classList.add('border-green-500');
        statusText.innerText = `✅ ¡Pago Exitoso! Mire la máquina para recibir su ${nombreProducto}.`;

      } catch (err) {
        console.error(err);
        statusBox.classList.remove('border-yellow-500');
        statusBox.classList.add('border-red-500');
        statusText.innerText = `❌ Error al procesar el pago: ${err.message}`;
      }
    }
  </script>
</body>
</html>
